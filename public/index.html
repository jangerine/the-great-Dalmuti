<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>웹 달무티</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
    .card {
      display: inline-block;
      width: 40px;
      height: 60px;
      line-height: 60px;
      text-align: center;
      margin: 5px;
      border: 2px solid #333;
      background: #fff;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      user-select: none;
    }
    .card.selected { background: #ffd700; border-color: #d4af37; transform: translateY(-5px); }
    #board { border: 2px dashed #888; padding: 20px; margin: 20px 0; background: #fff; min-height: 60px; }
    .btn { padding: 10px 20px; font-size: 14px; margin-right: 5px; cursor: pointer; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>👑 온라인 달무티</h1>

  <div id="login-area">
    <input type="text" id="nickname" placeholder="닉네임 입력">
    <button class="btn" onclick="join()">입장하기</button>
  </div>

  <div id="game-area" style="display:none;">
    <h3>접속자 목록</h3>
    <ul id="player-list"></ul>
    
    <!-- 게임 시작 후 숨겨질 버튼 -->
    <button class="btn" id="start-btn" onclick="startGame()">게임 시작</button>

    <div id="board">
      <h4>현재 바닥에 깔린 카드:</h4>
      <div id="last-card">없음</div>
    </div>

    <h3 id="turn-info"></h3>

    <h4>내 손패:</h4>
    <div id="my-hand"></div>
    <br>
    <button class="btn" onclick="playSelectedCards()">선택한 카드 내기</button>
    <button class="btn" onclick="passTurn()">패스하기</button>
  </div>

  <script>
    const socket = io();
    let selectedIndices = [];
    let myHandCards = [];

    function join() {
      const nick = document.getElementById('nickname').value;
      if (nick) {
        socket.emit('joinGame', nick);
        document.getElementById('login-area').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
      }
    }

    function startGame() {
      socket.emit('startGame');
    }

    socket.on('updateRoom', (room) => {
      const list = document.getElementById('player-list');
      list.innerHTML = room.players.map(p => `<li>${p.name}</li>`).join('');
      
      // 게임 중이면 시작 버튼 숨기기
      if (room.gameStarted) {
        document.getElementById('start-btn').style.display = 'none';
      } else {
        document.getElementById('start-btn').style.display = 'inline-block';
      }
    });

    socket.on('gameStarted', () => {
      document.getElementById('start-btn').style.display = 'none';
    });

    socket.on('turnUpdate', (data) => {
      document.getElementById('turn-info').innerText = `현재 차례: ${data.turnPlayerName}`;
      
      if (data.lastPlay) {
        const cardDisplay = data.lastPlay.cards.map(c => `[${c === 13 ? '어리광대' : c}]`).join(' ');
        document.getElementById('last-card').innerHTML = 
          `<b>${data.lastPlay.player}</b> 님이 냄: ${cardDisplay} (계급 ${data.lastPlay.rank}, ${data.lastPlay.count}장)`;
      } else {
        document.getElementById('last-card').innerText = '선(새 라운드 시작)';
      }
    });

    // 서버로부터 내 최신 손패를 받아서 화면에 렌더링
    socket.on('updateMyHand', (hand) => {
      myHandCards = hand;
      selectedIndices = [];
      renderMyHand();
    });

    function renderMyHand() {
      const container = document.getElementById('my-hand');
      container.innerHTML = '';
      
      myHandCards.forEach((cardRank, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card' + (selectedIndices.includes(index) ? ' selected' : '');
        cardEl.innerText = cardRank === 13 ? '🤡' : cardRank;
        cardEl.onclick = () => toggleSelect(index);
        container.appendChild(cardEl);
      });
    }

    function toggleSelect(index) {
      const pos = selectedIndices.indexOf(index);
      if (pos > -1) {
        selectedIndices.splice(pos, 1);
      } else {
        selectedIndices.push(index);
      }
      renderMyHand();
    }

    function playSelectedCards() {
      if (selectedIndices.length === 0) return;
      
      const cardsToPlay = selectedIndices.map(i => myHandCards[i]);
      socket.emit('playCards', cardsToPlay);
      selectedIndices = [];
    }

    function passTurn() {
      socket.emit('passTurn');
      selectedIndices = [];
      renderMyHand();
    }

    socket.on('errorMessage', (msg) => {
      alert(msg);
    });

    socket.on('gameOver', (rankings) => {
      alert('게임 종료!');
      document.getElementById('start-btn').style.display = 'inline-block';
    });
  </script>
</body>
</html>
